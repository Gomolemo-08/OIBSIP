<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>Welcome back</h1>
    <p class="lead">Log in to open your dashboard.</p>

    <p class="alert success-box" id="notice" role="status" hidden>Account created. You can log in now.</p>
    <p class="alert error-box" id="form-alert" role="alert" hidden></p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="identifier">Username or email</label>
        <input type="text" id="identifier" autocomplete="username" aria-describedby="identifier-error">
        <p class="error" id="identifier-error" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" autocomplete="current-password" aria-describedby="password-error">
          <button type="button" class="toggle" data-target="password" aria-pressed="false">Show</button>
        </div>
        <p class="error" id="password-error" hidden></p>
      </div>

      <button type="submit" class="btn" id="submit-btn">Login</button>
    </form>

    <p class="switch">New here? <a href="register.html">Create an account</a></p>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
